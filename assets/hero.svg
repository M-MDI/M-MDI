<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Mehdi Moulabbi, full-stack engineer, AI systems, application security" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.07"/></pattern>
<radialGradient id="fade" cx="0.5" cy="0" r="0.9"><stop offset="0.2" stop-color="#FFFFFF"/><stop offset="1" stop-color="#000000"/></radialGradient>
<mask id="gm"><rect width="1200" height="440" fill="url(#fade)"/></mask>
<clipPath id="clip"><rect width="1200" height="440" rx="24"/></clipPath>
<linearGradient id="name" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
<stop offset="0" stop-color="#FFFFFF"/><stop offset="0.5" stop-color="#00D9FF"/><stop offset="1" stop-color="#6366F1"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="600 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#302B63" stop-opacity="0"/><stop offset="0.5" stop-color="#00D9FF"/><stop offset="1" stop-color="#302B63" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#clip)">
<rect width="1200" height="440" fill="#0B1020"/>
<g filter="url(#blur)">
<circle cx="200" cy="40" r="230" fill="#302B63" opacity="0.9"><animateTransform attributeName="transform" type="translate" values="0 0;80 40;0 0" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1020" cy="60" r="190" fill="#00D9FF" opacity="0.35"><animateTransform attributeName="transform" type="translate" values="0 0;-70 50;0 0" dur="18s" repeatCount="indefinite"/></circle>
<circle cx="620" cy="400" r="170" fill="#6366F1" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 0;60 -40;0 0" dur="16s" repeatCount="indefinite"/></circle>
</g>
<rect width="1200" height="440" fill="url(#grid)" mask="url(#gm)"/>
<rect x="410" y="50" width="380" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
<circle cx="436" cy="68" r="4" fill="#00D9FF"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/></circle>
<text x="456" y="73" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="2" fill="#C9D1D9">OPEN TO OPPORTUNITIES WORLDWIDE</text>
<text x="600" y="205" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="url(#name)">MEHDI MOULABBI</text>
<text x="600" y="262" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="17" letter-spacing="4" fill="#00D9FF">FULL-STACK ENGINEER · AI SYSTEMS · APPLICATION SECURITY</text>
<text x="600" y="318" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#A9B0CC">I build software that ships, and AI systems that run locally.</text>
<rect x="300" y="396" width="600" height="2" fill="url(#line)"/>
</g>
<rect x="0.5" y="0.5" width="1199" height="439" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
</svg>
